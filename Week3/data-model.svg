<text x="677" y="203" font-family="Arial" font-size="13" fill="#263746">FK actor_id -&gt; USER</text>
<text x="677" y="223" font-family="Arial" font-size="13" fill="#263746">action, entity reference</text>
<text x="677" y="243" font-family="Arial" font-size="13" fill="#263746">occurred_at</text>
